server:
  host: "0.0.0.0"
  port: 8000
  debug: false

camera:
  source_type: "webcam"
  webcam_index: 0
  rtsp_url: ""
  target_fps: 30
  reconnect_delay_seconds: 3.0
  width: 1280
  height: 720

model:
  production_path: "models/production/best.pt"
  candidates_dir: "models/candidates"
  archive_dir: "models/archive"
  default_confidence: 0.25
  default_iou: 0.45
  device: "auto"

inventory:
  roi: null

alerts:
  empty_threshold: 0.80
  consecutive_seconds: 3.0
  cooldown_seconds: 30.0
  images_dir: "alerts/images"
  logs_file: "alerts/logs/alerts.jsonl"
  webhook_url: ""

active_learning:
  auto_collect: true
  low_confidence_threshold: 0.40
  high_missing_threshold: 0.70
  min_seconds_between_captures: 5.0
  collected_dir: "data/collected"
  pending_dir: "data/pending_review"
  approved_dir: "data/approved"
  validation_dir: "data/validation"

training:
  epochs: 50
  batch_size: 16
  imgsz: 640
  lr0: 0.01
  patience: 15
  min_approved_samples: 5
  eval_pass_map50: 0.80
