services:
  inventory-monitor:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cvw-inventory-monitor
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      # Persistencia de modelos, datasets, alertas y configuración
      - ./models:/app/models
      - ./data:/app/data
      - ./alerts:/app/alerts
      - ./configs:/app/configs
    # Habilitar GPU NVIDIA en Docker si está disponible (NVIDIA Container Toolkit)
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
